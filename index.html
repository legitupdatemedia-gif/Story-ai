<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Motion Studio</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #090909;
  color: white;
}

header {
  padding: 20px;
  background: #151515;
  border-bottom: 1px solid #292929;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  color: #ff8500;
  font-size: 23px;
  font-weight: bold;
}

.badge {
  background: #202020;
  color: #ff9a22;
  padding: 8px 12px;
  border-radius: 20px;
  font-size: 12px;
}

.container {
  max-width: 750px;
  margin: 30px auto;
  padding: 15px;
}

h1 {
  text-align: center;
  font-size: 30px;
  margin-bottom: 10px;
}

.subtitle {
  text-align: center;
  color: #999;
  margin-bottom: 30px;
}

.card {
  background: #171717;
  padding: 22px;
  border-radius: 15px;
  margin-bottom: 20px;
  border: 1px solid #292929;
}

label {
  display: block;
  margin-bottom: 12px;
  font-weight: bold;
  color: #ff9a22;
}

.upload {
  border: 2px dashed #ff8500;
  border-radius: 12px;
  padding: 35px 15px;
  text-align: center;
  cursor: pointer;
  color: #ccc;
}

.upload input {
  display: none;
}

#preview {
  width: 100%;
  max-height: 350px;
  object-fit: contain;
  margin-top: 15px;
  border-radius: 10px;
  display: none;
}

textarea, select, input[type=number] {
  width: 100%;
  padding: 14px;
  background: #242424;
  color: white;
  border: 1px solid #444;
  border-radius: 9px;
  outline: none;
  margin-bottom: 18px;
}

textarea {
  height: 120px;
  resize: vertical;
}

button {
  cursor: pointer;
  border: none;
}

.generate {
  width: 100%;
  background: linear-gradient(90deg,#ff7900,#ffad26);
  color: black;
  padding: 17px;
  font-size: 17px;
  font-weight: bold;
  border-radius: 10px;
}

.generate:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.status {
  text-align: center;
  color: #ffad26;
  margin: 20px 0;
}

video {
  width: 100%;
  border-radius: 12px;
  margin-top: 15px;
  display: none;
}

.download {
  display: none;
  background: #ff8500;
  color: black;
  text-decoration: none;
  padding: 13px;
  text-align: center;
  border-radius: 8px;
  margin-top: 15px;
  font-weight: bold;
}

footer {
  text-align: center;
  color: #666;
  padding: 25px;
  font-size: 12px;
}
</style>
</head>

<body>

<header>
  <div class="logo">⚡ AI MOTION</div>
  <div class="badge">AI VIDEO STUDIO</div>
</header>

<div class="container">

<h1>Create AI Videos</h1>
<p class="subtitle">
Turn any picture into an amazing AI video using just an image and prompt.
</p>

<div class="card">

<label>1. Upload Your Image</label>

<label class="upload" for="imageInput">
📸<br><br>
Click to upload your image<br>
<small>JPG, PNG or WEBP</small>
<input type="file" id="imageInput" accept="image/png,image/jpeg,image/webp">
</label>

<img id="preview" alt="Image preview">

</div>

<div class="card">

<label>2. Describe Your Video</label>

<textarea id="prompt"
placeholder="Example: Make this person look at the camera, smile naturally and speak with realistic lip movements. Add natural head movements and realistic expressions."></textarea>

<label>3. Video Duration</label>

<select id="duration">
<option value="5">5 Seconds</option>
<option value="10">10 Seconds</option>
<option value="15">15 Seconds</option>
<option value="30">30 Seconds</option>
<option value="60">60 Seconds</option>
</select>

<label>4. Speaking Speed</label>

<select id="speed">
<option value="0.75">Slow</option>
<option value="1">Normal</option>
<option value="1.25">Fast</option>
<option value="1.5">Very Fast</option>
</select>

<label>5. Audio</label>

<select id="audio">
<option value="true">Generate Audio</option>
<option value="false">No Audio</option>
</select>

<button class="generate" id="generateBtn">
✨ GENERATE AI VIDEO
</button>

<div class="status" id="status"></div>

</div>

<div class="card" id="resultCard" style="display:none">

<label>Your Generated Video</label>

<video id="resultVideo" controls></video>

<a id="download" class="download" download="ai-video.mp4">
⬇ DOWNLOAD VIDEO
</a>

</div>

</div>

<footer>
AI MOTION STUDIO © 2026
</footer>

<script>

const imageInput = document.getElementById("imageInput");
const preview = document.getElementById("preview");
const generateBtn = document.getElementById("generateBtn");
const statusText = document.getElementById("status");

let selectedImage = null;

imageInput.addEventListener("change", function() {

  const file = this.files[0];

  if (!file) return;

  if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
    alert("Please upload JPG, PNG or WEBP.");
    return;
  }

  selectedImage = file;

  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";

});

generateBtn.addEventListener("click", async function() {

  const prompt = document.getElementById("prompt").value.trim();

  if (!selectedImage) {
    alert("Please upload an image first.");
    return;
  }

  if (!prompt) {
    alert("Please enter your video prompt.");
    return;
  }

  generateBtn.disabled = true;
  generateBtn.textContent = "GENERATING...";
  statusText.textContent = "Submitting your image to the AI video generator...";

  try {

    const formData = new FormData();

    formData.append("image", selectedImage);
    formData.append("prompt", prompt);
    formData.append("duration", document.getElementById("duration").value);
    formData.append("speed", document.getElementById("speed").value);
    formData.append("audio", document.getElementById("audio").value);

    // Connect this endpoint to your backend AI provider.
    const response = await fetch("/api/generate", {
      method: "POST",
      body: formData
    });

    if (!response.ok) {
      const error = await response.text();
      throw new Error(error || "Video generation failed.");
    }

    const data = await response.json();

    if (data.videoUrl) {

      showVideo(data.videoUrl);

    } else if (data.jobId) {

      await checkGeneration(data.jobId);

    } else {

      throw new Error("The server did not return a video or job ID.");

    }

  } catch (error) {

    statusText.textContent = "Error: " + error.message;

  } finally {

    generateBtn.disabled = false;
    generateBtn.textContent = "✨ GENERATE AI VIDEO";

  }

});

async function checkGeneration(jobId) {

  statusText.textContent = "AI is creating your video...";

  for (let i = 0; i < 120; i++) {

    await new Promise(resolve => setTimeout(resolve, 5000));

    const response = await fetch(
      "/api/status/" + encodeURIComponent(jobId)
    );

    if (!response.ok) {
      throw new Error("Unable to check generation status.");
    }

    const data = await response.json();

    if (data.status === "completed" && data.videoUrl) {
      showVideo(data.videoUrl);
      return;
    }

    if (data.status === "failed") {
      throw new Error(data.error || "Video generation failed.");
    }

    statusText.textContent =
      "Creating your video... " + (i + 1) + "/120";
  }

  throw new Error("Generation is taking too long. Check again later.");

}

function showVideo(url) {

  const video = document.getElementById("resultVideo");
  const download = document.getElementById("download");

  video.src = url;
  video.style.display = "block";

  download.href = url;
  download.style.display = "block";

  document.getElementById("resultCard").style.display = "block";

  statusText.textContent = "Your AI video is ready!";

}

</script>

</body>
</html>
