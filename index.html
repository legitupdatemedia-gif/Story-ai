<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talking Character Prompt Builder — Image-to-Video</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    color: #e8e8f0; min-height: 100vh; padding: 30px 15px;
  }
  .container { max-width: 860px; margin: 0 auto; }
  h1 { text-align: center; font-size: 1.7em; margin-bottom: 6px;
       background: linear-gradient(90deg,#a78bfa,#60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .subtitle { text-align: center; color: #9ca3af; margin-bottom: 28px; font-size: .95em; }
  .card {
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12);
    border-radius: 14px; padding: 22px; margin-bottom: 20px; backdrop-filter: blur(8px);
  }
  label { display: block; font-weight: 600; font-size: .85em; margin: 14px 0 5px; color: #c4b5fd; letter-spacing: .3px; }
  input[type=text], textarea, select {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,.18);
    background: rgba(0,0,0,.35); color: #fff; font-size: .95em; outline: none;
  }
  input:focus, textarea:focus, select:focus { border-color: #a78bfa; }
  textarea { resize: vertical; min-height: 70px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 180px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 7px 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,.25);
    background: transparent; color: #e8e8f0; cursor: pointer; font-size: .82em; transition: .15s;
  }
  .chip:hover { border-color: #a78bfa; }
  .chip.active { background: #7c3aed; border-color: #7c3aed; color: #fff; }
  .btn {
    width: 100%; padding: 14px; margin-top: 20px; border: none; border-radius: 10px;
    background: linear-gradient(90deg,#7c3aed,#4f46e5); color: #fff; font-size: 1.05em;
    font-weight: 700; cursor: pointer; transition: .2s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(124,58,237,.45); }
  .btn-copy {
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.25);
    padding: 10px; border-radius: 8px; margin-top: 10px; cursor: pointer; color: #fff; width: 100%;
  }
  .btn-copy:hover { background: rgba(255,255,255,.2); }
  #output {
    white-space: pre-wrap; font-family: 'Consolas', monospace; font-size: .88em;
    line-height: 1.6; color: #d1fae5; background: rgba(0,0,0,.4);
    padding: 16px; border-radius: 10px; border: 1px solid rgba(110,231,183,.25); min-height: 120px;
  }
  .hidden { display: none; }
  .tip { font-size: .78em; color: #9ca3af; margin-top: 5px; }
</style>
</head>
<body>
<div class="container">
  <h1>🎬 Talking Character Prompt Builder</h1>
  <p class="subtitle">For image-to-video AI tools — Kling, Runway Act-One, Hedra, Pika, Hailuo, Veo & more</p>

  <div class="card">
    <div class="row">
      <div>
        <label>Character description</label>
        <input type="text" id="charDesc" placeholder="e.g. a friendly young woman with curly red hair, green eyes">
      </div>
      <div>
        <label>Video tool / model</label>
        <select id="tool">
          <option value="generic">Generic / Any tool</option>
          <option value="kling">Kling AI</option>
          <option value="runway">Runway Act-One</option>
          <option value="hedra">Hedra Character-3</option>
          <option value="veo">Google Veo</option>
          <option value="hailuo">Hailuo / MiniMax</option>
          <option value="pika">Pika</option>
        </select>
      </div>
    </div>

    <label>Emotion / expression while speaking</label>
    <div class="chips" id="emotionChips"></div>

    <label>Speech intensity (lip movement)</label>
    <div class="chips" id="intensityChips"></div>

    <label>Camera & framing</label>
    <div class="chips" id="cameraChips"></div>

    <label>Background / scene</label>
    <input type="text" id="scene" placeholder="e.g. cozy home office with warm evening lighting, shallow depth of field">

    <label>What the character says (optional — drives mouth/word timing)</label>
    <textarea id="dialogue" placeholder="e.g. 'Welcome back, everyone — today I'm going to show you something amazing.'"></textarea>

    <label>Head & body motion</label>
    <div class="chips" id="motionChips"></div>

    <label>Lighting & style</label>
    <div class="chips" id="styleChips"></div>

    <label>Extra details (optional)</label>
    <textarea id="extras" placeholder="e.g. blinking naturally, subtle eyebrow raises, hands gesturing slightly, 4K detail"></textarea>

    <button class="btn" id="generateBtn">✨ Generate Prompt</button>
  </div>

  <div class="card hidden" id="resultCard">
    <label>Generated prompt</label>
    <div id="output"></div>
    <button class="btn-copy" id="copyBtn">📋 Copy to clipboard</button>
    <p class="tip">Tip: pair the prompt with a high-quality front-facing portrait; keep the face large in frame for better lip-sync accuracy.</p>
  </div>
</div>

<script>
const chipGroups = {
  emotionChips: { key: 'emotion', options: ['happy & upbeat', 'calm & confident', 'serious & focused', 'excited & energetic', 'warm & empathetic', 'mysterious & soft-spoken'] },
  intensityChips: { key: 'intensity', options: ['subtle natural lip movement', 'clear articulate lip-sync', 'strong expressive mouth movement'] },
  cameraChips: { key: 'camera', options: ['close-up on face', 'medium shot chest-up', 'slow gentle push-in', 'static locked shot'] },
  motionChips: { key: 'motion', options: ['subtle head nods & tilts', 'natural blinking', 'slight eyebrow raises', 'hand gestures while talking', 'hair & fabric gentle motion'] },
  styleChips: { key: 'style', options: ['cinematic lighting', 'soft warm studio light', 'golden hour glow', 'photorealistic 4K', 'shallow depth of field'] }
};
const state = { emotion: null, intensity: null, camera: null, motion: new Set(), style: new Set() };

Object.entries(chipGroups).forEach(([groupId, cfg]) => {
  const el = document.getElementById(groupId);
  const multi = cfg.key === 'motion' || cfg.key === 'style';
  cfg.options.forEach(opt => {
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = opt;
    b.onclick = () => {
      if (multi) {
        b.classList.toggle('active');
        b.classList.contains('active') ? state[cfg.key].add(opt) : state[cfg.key].delete(opt);
      } else {
        const wasActive = b.classList.contains('active');
        el.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        if (!wasActive) { b.classList.add('active'); state[cfg.key] = opt; } else state[cfg.key] = null;
      }
    };
    el.appendChild(b);
  });
});

document.getElementById('generateBtn').onclick = () => {
  const desc = document.getElementById('charDesc').value.trim() || 'the character in the image';
  const scene = document.getElementById('scene').value.trim();
  const dialogue = document.getElementById('dialogue').value.trim();
  const extras = document.getElementById('extras').value.trim();
  const tool = document.getElementById('tool').value;

  const parts = [];
  parts.push(`A lifelike talking video of ${desc} speaking directly to the camera.`);
  if (state.emotion) parts.push(`Expression: ${state.emotion}.`);
  if (state.intensity) parts.push(`Mouth: ${state.intensity}, precisely synced as if speaking naturally.`);
  if (dialogue) parts.push(`The character says: "${dialogue}" — lips move in exact sync with these words.`);
  else parts.push(`The character speaks naturally with realistic lip-sync and mouth articulation.`);
  if (state.camera) parts.push(`Camera: ${state.camera}.`);
  if (scene) parts.push(`Scene: ${scene}.`);
  if (state.motion.size) parts.push(`Motion details: ${[...state.motion].join(', ')}.`);
  if (state.style.size) parts.push(`Visual style: ${[...state.style].join(', ')}.`);
  if (extras) parts.push(extras);

  let prompt = parts.join(' ');

  if (tool === 'runway') prompt += '\n\n[Runway Act-One note: upload your image as the driver/reference, then use the performance video for facial animation. Use this prompt for style/motion direction.]';
  if (tool === 'hedra') prompt += '\n\n[Hedra note: attach the audio file with the dialogue; use the prompt above for appearance and motion guidance.]';
  if (tool === 'kling' || tool === 'hailuo') prompt += '\n\n[Note: set "lip-sync" or "talking avatar" mode, upload the dialogue audio, and use the prompt for visual direction.]';
  if (tool === 'veo') prompt += '\n\n[Veo note: include the spoken line in the prompt so speech and lip-sync are generated together.]';

  document.getElementById('output').textContent = prompt;
  document.getElementById('resultCard').classList.remove('hidden');
};

document.getElementById('copyBtn').onclick = () => {
  navigator.clipboard.writeText(document.getElementById('output').textContent);
  const b = document.getElementById('copyBtn');
  b.textContent = '✅ Copied!';
  setTimeout(() => b.textContent = '📋 Copy to clipboard', 1500);
};
</script>
</body>
</html>
